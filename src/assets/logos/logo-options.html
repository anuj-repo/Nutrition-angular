<!DOCTYPE html>

<head>

<style>
  body { background: #f5f5f5; font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
  .logo-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
  .logo-card h3 { margin: 15px 0 5px; color: #333; font-size: 14px; }

<!-- Logo 1: Leaf + Shield -->

          <stop offset="100%" style="stop-color:#1b5e20"/>

        <linearGradient id="g1b" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ffd700"/>
          <stop offset="100%" style="stop-color:#ff9800"/>
        </linearGradient>
      </defs>
      <!-- Shield shape -->
      <path d="M100 20 L170 50 L170 110 Q170 160 100 185 Q30 160 30 110 L30 50 Z" fill="url(#g1)" opacity="0.9"/>
      <path d="M100 30 L160 55 L160 108 Q160 152 100 175 Q40 152 40 108 L40 55 Z" fill="none" stroke="#ffd700" stroke-width="2"/>

      <path d="M100 90 Q90 95 92 105" stroke="#fff" stroke-width="1" fill="none"/>

      <text x="100" y="160" text-anchor="middle" font-size="9" font-weight="600" fill="#a5d6a7" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
  <div class="dark-bg">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 20 L170 50 L170 110 Q170 160 100 185 Q30 160 30 110 L30 50 Z" fill="#2e7d32"/>

      <text x="100" y="160" text-anchor="middle" font-size="9" font-weight="600" fill="#a5d6a7" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
</div>
