<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutrition Forever Wellness - Modern Logos</title>
<style>
  body { background: #f0f0f0; font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
  .card h3 { margin: 12px 0 5px; color: #333; font-size: 13px; }
  .dark { background: #1a1a2e; padding: 25px; border-radius: 10px; margin-top: 8px; }
  .light { background: #fff; padding: 25px; border-radius: 10px; margin-top: 8px; border: 1px solid #eee; }
</style>
</head>
<body>

<!-- Style 1: Person + Leaf (like top-left in reference) -->
<div class="card">
  <h3>1. Person + Leaf</h3>
  <div class="light">
    <svg width="200" height="180" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <!-- Person abstract -->
      <circle cx="90" cy="35" r="12" fill="#2e7d32"/>
      <!-- Body as leaf shape -->
      <path d="M90 50 Q60 80 70 120 Q80 100 90 95 Q100 100 110 120 Q120 80 90 50 Z" fill="#43a047"/>
      <!-- Arm reaching up becoming a leaf -->
      <path d="M105 70 Q120 50 135 40 Q130 55 115 70 Z" fill="#66bb6a"/>
      <path d="M108 72 Q125 55 138 48 Q132 60 118 72 Z" fill="#2e7d32"/>
      <!-- Leaf vein -->
      <path d="M90 50 L90 95" stroke="#a5d6a7" stroke-width="1.2" fill="none"/>
      <!-- Text -->
      <text x="100" y="145" text-anchor="middle" font-size="16" font-weight="900" fill="#1b5e20" font-family="Segoe UI">Nutrition</text>
      <text x="100" y="163" text-anchor="middle" font-size="10" font-weight="600" fill="#43a047" font-family="Segoe UI" letter-spacing="3">FOREVER WELLNESS</text>
    </svg>
  </div>
  <div class="dark">
    <svg width="200" height="180" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <circle cx="90" cy="35" r="12" fill="#66bb6a"/>
      <path d="M90 50 Q60 80 70 120 Q80 100 90 95 Q100 100 110 120 Q120 80 90 50 Z" fill="#43a047"/>
      <path d="M105 70 Q120 50 135 40 Q130 55 115 70 Z" fill="#66bb6a"/>
      <path d="M108 72 Q125 55 138 48 Q132 60 118 72 Z" fill="#a5d6a7"/>
      <path d="M90 50 L90 95" stroke="#a5d6a7" stroke-width="1.2" fill="none"/>
      <text x="100" y="145" text-anchor="middle" font-size="16" font-weight="900" fill="#ffd700" font-family="Segoe UI">Nutrition</text>
      <text x="100" y="163" text-anchor="middle" font-size="10" font-weight="600" fill="#00d4aa" font-family="Segoe UI" letter-spacing="3">FOREVER WELLNESS</text>
    </svg>
  </div>
</div>

<!-- Style 2: Circular Leaf Ring -->
<div class="card">
  <h3>2. Leaf Circle Ring</h3>
  <div class="light">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Circular leaf arrangement -->
      <path d="M100 30 Q115 45 110 65 Q105 50 100 45 Q95 50 90 65 Q85 45 100 30 Z" fill="#2e7d32"/>
      <path d="M135 50 Q145 68 135 85 Q132 70 128 65 Q122 68 115 82 Q118 60 135 50 Z" fill="#388e3c" transform="rotate(60, 100, 100)"/>
      <path d="M135 50 Q145 68 135 85 Q132 70 128 65 Q122 68 115 82 Q118 60 135 50 Z" fill="#43a047" transform="rotate(120, 100, 100)"/>
      <path d="M135 50 Q145 68 135 85 Q132 70 128 65 Q122 68 115 82 Q118 60 135 50 Z" fill="#66bb6a" transform="rotate(180, 100, 100)"/>
      <path d="M135 50 Q145 68 135 85 Q132 70 128 65 Q122 68 115 82 Q118 60 135 50 Z" fill="#81c784" transform="rotate(240, 100, 100)"/>
      <path d="M135 50 Q145 68 135 85 Q132 70 128 65 Q122 68 115 82 Q118 60 135 50 Z" fill="#a5d6a7" transform="rotate(300, 100, 100)"/>
      <!-- Center circle -->
      <circle cx="100" cy="100" r="25" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
      <text x="100" y="106" text-anchor="middle" font-size="18" font-weight="900" fill="#2e7d32" font-family="Georgia">NF</text>
      <!-- Text below -->
      <text x="100" y="155" text-anchor="middle" font-size="11" font-weight="800" fill="#1b5e20" font-family="Segoe UI">NUTRITION FOREVER</text>
      <text x="100" y="170" text-anchor="middle" font-size="9" font-weight="600" fill="#ffd700" letter-spacing="2" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
</div>

<!-- Style 3: Apple + Spoon/Fork -->
<div class="card">
  <h3>3. Apple + Leaf</h3>
  <div class="light">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Apple shape -->
      <path d="M100 45 Q60 50 50 90 Q45 130 70 150 Q85 165 100 160 Q115 165 130 150 Q155 130 150 90 Q140 50 100 45 Z" fill="#2e7d32"/>
      <!-- Apple highlight -->
      <path d="M75 70 Q80 60 90 58 Q82 68 75 70 Z" fill="#43a047" opacity="0.5"/>
      <!-- Leaf on top -->
      <path d="M100 45 Q110 30 125 25 Q115 35 105 42 Z" fill="#66bb6a"/>
      <path d="M100 45 Q108 32 120 28" stroke="#388e3c" stroke-width="1" fill="none"/>
      <!-- Stem -->
      <path d="M100 45 L100 35 Q98 30 100 28" stroke="#5d4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- N letter inside -->
      <text x="100" y="115" text-anchor="middle" font-size="45" font-weight="900" fill="#fff" font-family="Georgia">N</text>
      <!-- Text -->
      <text x="100" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#1b5e20" font-family="Segoe UI">NUTRITION FOREVER</text>
      <text x="100" y="197" text-anchor="middle" font-size="9" fill="#ffd700" font-weight="700" letter-spacing="2" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
  <div class="dark">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 45 Q60 50 50 90 Q45 130 70 150 Q85 165 100 160 Q115 165 130 150 Q155 130 150 90 Q140 50 100 45 Z" fill="#2e7d32"/>
      <path d="M100 45 Q110 30 125 25 Q115 35 105 42 Z" fill="#66bb6a"/>
      <path d="M100 45 L100 35 Q98 30 100 28" stroke="#8d6e63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="100" y="115" text-anchor="middle" font-size="45" font-weight="900" fill="#ffd700" font-family="Georgia">N</text>
      <text x="100" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#ffd700" font-family="Segoe UI">NUTRITION FOREVER</text>
      <text x="100" y="197" text-anchor="middle" font-size="9" fill="#00d4aa" font-weight="700" letter-spacing="2" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
</div>

<!-- Style 4: Swoosh Leaf - Modern Corporate -->
<div class="card">
  <h3>4. Modern Swoosh</h3>
  <div class="light">
    <svg width="280" height="120" viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
      <!-- Swoosh leaf shape -->
      <path d="M30 60 Q50 20 80 30 Q60 45 50 60 Z" fill="#2e7d32"/>
      <path d="M30 60 Q50 100 80 90 Q60 75 50 60 Z" fill="#43a047"/>
      <!-- Small circle (person head) -->
      <circle cx="55" cy="42" r="8" fill="#66bb6a"/>
      <!-- Growing leaf from top -->
      <path d="M62 35 Q70 20 78 22 Q72 30 65 35 Z" fill="#ffd700"/>
      <!-- Text -->
      <text x="100" y="52" font-size="24" font-weight="900" fill="#1b5e20" font-family="Segoe UI">Nutrition</text>
      <text x="100" y="72" font-size="13" font-weight="700" fill="#43a047" font-family="Segoe UI">Forever Wellness</text>
      <text x="100" y="92" font-size="8" fill="#888" font-family="Segoe UI" letter-spacing="1">Premium Ayurvedic · Stamina Core+ · Health · Wealth · Security</text>
      <!-- Underline accent -->
      <line x1="100" y1="100" x2="250" y2="100" stroke="#ffd700" stroke-width="2"/>
    </svg>
  </div>
  <div class="dark">
    <svg width="280" height="120" viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 60 Q50 20 80 30 Q60 45 50 60 Z" fill="#2e7d32"/>
      <path d="M30 60 Q50 100 80 90 Q60 75 50 60 Z" fill="#43a047"/>
      <circle cx="55" cy="42" r="8" fill="#66bb6a"/>
      <path d="M62 35 Q70 20 78 22 Q72 30 65 35 Z" fill="#ffd700"/>
      <text x="100" y="52" font-size="24" font-weight="900" fill="#ffd700" font-family="Segoe UI">Nutrition</text>
      <text x="100" y="72" font-size="13" font-weight="700" fill="#00d4aa" font-family="Segoe UI">Forever Wellness</text>
      <text x="100" y="92" font-size="8" fill="#888" font-family="Segoe UI" letter-spacing="1">Premium Ayurvedic · Stamina Core+ · Health · Wealth · Security</text>
      <line x1="100" y1="100" x2="250" y2="100" stroke="#ffd700" stroke-width="2"/>
    </svg>
  </div>
</div>

<!-- Style 5: Double Leaf Hands (like people holding) -->
<div class="card">
  <h3>5. Wellness Hands</h3>
  <div class="light">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Two curved leaf-hands forming a circle -->
      <path d="M100 30 Q140 40 155 70 Q160 100 140 125 Q120 110 100 100" fill="#2e7d32" opacity="0.9"/>
      <path d="M100 30 Q60 40 45 70 Q40 100 60 125 Q80 110 100 100" fill="#43a047" opacity="0.9"/>
      <!-- Person/sprout in center -->
      <circle cx="100" cy="75" r="10" fill="#ffd700"/>
      <path d="M100 85 L100 110" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 95 Q90 88 85 92" stroke="#ffd700" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M100 95 Q110 88 115 92" stroke="#ffd700" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Small leaf on top -->
      <path d="M100 30 Q108 18 115 20 Q108 26 103 30 Z" fill="#81c784"/>
      <!-- Text -->
      <text x="100" y="150" text-anchor="middle" font-size="14" font-weight="900" fill="#1b5e20" font-family="Segoe UI">NUTRITION</text>
      <text x="100" y="167" text-anchor="middle" font-size="14" font-weight="900" fill="#1b5e20" font-family="Segoe UI">FOREVER</text>
      <text x="100" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#ffd700" letter-spacing="3" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
  <div class="dark">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 30 Q140 40 155 70 Q160 100 140 125 Q120 110 100 100" fill="#2e7d32"/>
      <path d="M100 30 Q60 40 45 70 Q40 100 60 125 Q80 110 100 100" fill="#43a047"/>
      <circle cx="100" cy="75" r="10" fill="#ffd700"/>
      <path d="M100 85 L100 110" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 95 Q90 88 85 92" stroke="#ffd700" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M100 95 Q110 88 115 92" stroke="#ffd700" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M100 30 Q108 18 115 20 Q108 26 103 30 Z" fill="#81c784"/>
      <text x="100" y="150" text-anchor="middle" font-size="14" font-weight="900" fill="#ffd700" font-family="Segoe UI">NUTRITION</text>
      <text x="100" y="167" text-anchor="middle" font-size="14" font-weight="900" fill="#ffd700" font-family="Segoe UI">FOREVER</text>
      <text x="100" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#00d4aa" letter-spacing="3" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
</div>

<!-- Style 6: Circular with Capsule + Leaf -->
<div class="card">
  <h3>6. Circle Capsule</h3>
  <div class="light">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer green circle -->
      <circle cx="100" cy="90" r="70" fill="none" stroke="#2e7d32" stroke-width="4"/>
      <!-- Half circle fill -->
      <path d="M30 90 A70 70 0 0 1 170 90" fill="#2e7d32"/>
      <!-- Capsule -->
      <rect x="85" y="55" width="30" height="60" rx="15" fill="#ffd700" stroke="#ff9800" stroke-width="1"/>
      <rect x="85" y="55" width="30" height="30" rx="15" fill="#2e7d32"/>
      <!-- Leaf sprouting -->
      <path d="M95 50 Q88 35 92 22 Q98 32 95 50 Z" fill="#66bb6a"/>
      <path d="M105 48 Q112 32 118 28 Q114 38 105 48 Z" fill="#43a047"/>
      <!-- Text -->
      <text x="100" y="145" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Segoe UI" letter-spacing="2">STAMINA CORE+</text>
      <text x="100" y="175" text-anchor="middle" font-size="13" font-weight="900" fill="#1b5e20" font-family="Segoe UI">Nutrition Forever</text>
      <text x="100" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#ffd700" letter-spacing="2" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
  <div class="dark">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="90" r="70" fill="none" stroke="#ffd700" stroke-width="3"/>
      <path d="M30 90 A70 70 0 0 1 170 90" fill="#2e7d32"/>
      <rect x="85" y="55" width="30" height="60" rx="15" fill="#ffd700"/>
      <rect x="85" y="55" width="30" height="30" rx="15" fill="#2e7d32"/>
      <path d="M95 50 Q88 35 92 22 Q98 32 95 50 Z" fill="#66bb6a"/>
      <path d="M105 48 Q112 32 118 28 Q114 38 105 48 Z" fill="#a5d6a7"/>
      <text x="100" y="145" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Segoe UI" letter-spacing="2">STAMINA CORE+</text>
      <text x="100" y="175" text-anchor="middle" font-size="13" font-weight="900" fill="#ffd700" font-family="Segoe UI">Nutrition Forever</text>
      <text x="100" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4aa" letter-spacing="2" font-family="Segoe UI">WELLNESS</text>
    </svg>
  </div>
</div>

</body>
</html>
