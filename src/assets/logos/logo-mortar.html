<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutrition Forever Wellness - Logo (Mortar & Pestle Style)</title>
<style>
  body { background: #f5f5f5; font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
  .logo-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
  .logo-card h3 { margin: 15px 0 5px; color: #333; font-size: 14px; }
  .dark-bg { background: #1a1a2e; padding: 30px; border-radius: 12px; margin-top: 10px; }

<body>

<!-- Logo 1: Mortar & Pestle with Leaves - Circle -->
<div class="logo-card">

    <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">

      <circle cx="110" cy="100" r="78" fill="none" stroke="#ffd700" stroke-width="2"/>
      <!-- Mortar (bowl) -->
      <path d="M75 105 Q75 130 90 135 L130 135 Q145 130 145 105 Z" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1"/>

      <rect x="125" y="55" width="8" height="45" rx="4" fill="#d7ccc8" transform="rotate(20, 129, 77)"/>
      <ellipse cx="134" cy="52" rx="6" ry="8" fill="#bcaaa4" transform="rotate(20, 134, 52)"/>

      <path d="M95 90 Q85 70 90 55 Q100 70 95 90 Z" fill="#66bb6a"/>
      <path d="M90 55 L95 90" stroke="#a5d6a7" stroke-width="0.8" fill="none"/>
      <path d="M105 85 Q100 60 110 50 Q115 65 105 85 Z" fill="#43a047"/>
      <path d="M110 50 L105 85" stroke="#81c784" stroke-width="0.8" fill="none"/>
      <path d="M115 88 Q120 68 130 62 Q125 75 115 88 Z" fill="#2e7d32"/>

      <path d="M80 95 Q70 85 65 75 Q75 80 80 95 Z" fill="#81c784" opacity="0.8"/>
      <!-- Text -->
      <text x="110" y="158" text-anchor="middle" font-size="10" font-weight="800" fill="#ffd700" font-family="Segoe UI" letter-spacing="1">NUTRITION FOREVER</text>
      <text x="110" y="172" text-anchor="middle" font-size="8" font-weight="600" fill="#a5d6a7" font-family="Segoe UI" letter-spacing="2">WELLNESS</text>
      <!-- Bottom text -->
      <text x="110" y="210" text-anchor="middle" font-size="9" font-weight="700" fill="#1b5e20" font-family="Segoe UI">Stamina Core+ · Ayurvedic</text>

  <div class="dark-bg">
    <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
